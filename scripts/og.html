<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>OG image</title>
    <!-- Source for og.png. Render with: node scripts/render-og.mjs -->
    <style>
      @font-face {
        font-family: "Space Grotesk";
        font-weight: 300 700;
        src: url("../fonts/space-grotesk-latin-wght.woff2")
          format("woff2-variations");
      }
      @font-face {
        font-family: "Caveat";
        font-weight: 600;
        src: url("../fonts/caveat-latin-600.woff2") format("woff2");
      }
      :root {
        --page: #0f2a4a;
        --panel: #11304f;
        --edge: #35608f;
        --marker: #ffd84d;
        --pen: #ff9d5c;
        --pencil: #8fb3dc;
        --head: #f4f8ff;
        --body: #d3e1f3;
        --muted: #a7c0de;
        --minor: rgb(170 205 245 / 0.06);
        --major: rgb(170 205 245 / 0.11);
        --mono:
          ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono",
          "DejaVu Sans Mono", monospace;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        position: relative;
        background-color: var(--page);
        background-image:
          linear-gradient(var(--major) 1px, transparent 1px),
          linear-gradient(90deg, var(--major) 1px, transparent 1px),
          linear-gradient(var(--minor) 1px, transparent 1px),
          linear-gradient(90deg, var(--minor) 1px, transparent 1px);
        background-size:
          80px 80px,
          80px 80px,
          16px 16px,
          16px 16px;
        font-family: "Space Grotesk", sans-serif;
        color: var(--body);
        -webkit-font-smoothing: antialiased;
      }
      .glow {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(
            ellipse 55% 50% at 24% 30%,
            rgb(255 216 77 / 0.1),
            transparent 70%
          ),
          radial-gradient(
            ellipse 45% 45% at 82% 78%,
            rgb(120 180 255 / 0.16),
            transparent 70%
          );
      }
      /* Drawing sheet border with corner registration ticks */
      .sheet {
        position: absolute;
        inset: 28px;
        border: 1px solid rgb(53 96 143 / 0.7);
      }
      .sheet i {
        position: absolute;
        width: 22px;
        height: 22px;
        border-color: var(--pencil);
        border-style: solid;
        border-width: 0;
      }
      .sheet i:nth-child(1) {
        top: -2px;
        left: -2px;
        border-top-width: 3px;
        border-left-width: 3px;
      }
      .sheet i:nth-child(2) {
        top: -2px;
        right: -2px;
        border-top-width: 3px;
        border-right-width: 3px;
      }
      .sheet i:nth-child(3) {
        bottom: -2px;
        left: -2px;
        border-bottom-width: 3px;
        border-left-width: 3px;
      }
      .sheet i:nth-child(4) {
        bottom: -2px;
        right: -2px;
        border-bottom-width: 3px;
        border-right-width: 3px;
      }
      .content {
        position: absolute;
        left: 96px;
        top: 112px;
        right: 96px;
      }
      .eyebrow {
        color: var(--marker);
        font: 500 22px/1.4 var(--mono);
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      h1 {
        position: relative;
        margin-top: 22px;
        color: var(--head);
        font-size: 104px;
        font-weight: 600;
        line-height: 1.04;
        letter-spacing: -0.025em;
      }
      /* Faint construction lines, like .trace on the site headline */
      h1::before {
        content: "";
        position: absolute;
        left: -96px;
        right: -96px;
        top: 0.2em;
        border-top: 1.5px dashed var(--pencil);
        opacity: 0.22;
      }
      h1::after {
        content: "";
        position: absolute;
        left: -22px;
        top: -0.35em;
        bottom: -0.3em;
        border-left: 1.5px dashed var(--pencil);
        opacity: 0.2;
      }
      .scribble {
        position: relative;
        display: inline-block;
        color: var(--marker);
        white-space: nowrap;
      }
      .scribble svg {
        position: absolute;
        left: -2%;
        bottom: -0.1em;
        width: 104%;
        height: 0.3em;
        overflow: visible;
      }
      .scribble path {
        fill: none;
        stroke: var(--pen);
        stroke-width: 7;
        stroke-linecap: round;
      }
      .sub {
        margin-top: 40px;
        color: var(--body);
        font-size: 32px;
        line-height: 1.35;
      }
      .foot {
        position: absolute;
        left: 96px;
        right: 96px;
        bottom: 66px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .url {
        color: var(--muted);
        font: 500 22px/1 var(--mono);
        letter-spacing: 0.08em;
      }
      .hand {
        color: var(--pen);
        font:
          600 38px/1 "Caveat",
          cursive;
        transform: rotate(-3deg);
      }
      .hand svg {
        width: 44px;
        height: 28px;
        margin-left: 6px;
        vertical-align: -4px;
        fill: none;
        stroke: var(--pen);
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .mono-tag {
        position: absolute;
        top: 52px;
        right: 60px;
        color: var(--pencil);
        font: 500 16px/1 var(--mono);
        letter-spacing: 0.16em;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="sheet"><i></i><i></i><i></i><i></i></div>
    <p class="mono-tag">SHEET 01 / TE</p>
    <div class="content">
      <p class="eyebrow">Tyler Eich · Freelance developer</p>
      <h1>
        Need a guy?<br /><span class="scribble"
          >I'm your guy.<svg
            viewBox="0 0 300 20"
            preserveAspectRatio="none"
            aria-hidden="true"
          >
            <path d="M4 13 C 60 5, 120 17, 180 9 S 268 5, 296 11" /></svg
        ></span>
      </h1>
      <p class="sub">Websites, apps and fixes. Built, finished or fixed.</p>
    </div>
    <div class="foot">
      <span class="url">TYLEREICH.COM</span>
      <span class="hand"
        >hand it to me<svg viewBox="0 0 44 28">
          <path d="M2 18 C 14 8, 26 22, 40 10" />
          <path d="M31 8 L 40 10 L 37 19" /></svg
      ></span>
    </div>
  </body>
</html>
